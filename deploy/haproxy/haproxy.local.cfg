# HAProxy configuration for running WITHOUT Docker.
#
# Use this when the two app instances run directly on your machine:
#   PORT=3100 node dist/main.js
#   PORT=3200 node dist/main.js
#   haproxy -f deploy/haproxy/haproxy.local.cfg
#
# Differences from haproxy.cfg:
#   - backends are 127.0.0.1:3100 / 127.0.0.1:3200 instead of Docker DNS names
#   - this file must be run by a local `haproxy` binary (brew install haproxy)

global
    maxconn 4096
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    option forwardfor
    option redispatch
    retries 3
    timeout connect 5s
    timeout client 120s
    timeout server 120s
    timeout tunnel 1h

frontend http_in
    bind *:8080
    default_backend app_servers

backend app_servers
    balance roundrobin
    cookie SERVERID insert indirect nocache httponly

    option httpchk GET /
    http-check expect status 200
    default-server inter 2s fall 3 rise 2

    server app1 127.0.0.1:3100 check cookie app1
    server app2 127.0.0.1:3200 check cookie app2

frontend stats
    bind *:8404
    mode http
    stats enable
    stats uri /
    stats refresh 5s
    stats show-legends

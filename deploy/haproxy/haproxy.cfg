# HAProxy configuration for local multi-instance testing.
#
# Traffic path:
#   client -> :8080 (HAProxy) -> app1:3000 or app2:3000
#   client -> :8404 (HAProxy stats page)
#
# Sticky sessions:
#   `cookie SERVERID` makes HAProxy set a cookie naming the chosen backend. On
#   the next request the browser sends it back and HAProxy keeps that client on
#   the same replica. This matters for Socket.IO's HTTP long-polling transport,
#   where every poll must reach the process that owns the session.
#
# WebSocket:
#   HAProxy in HTTP mode detects `Connection: Upgrade` and switches to tunnel
#   mode automatically. `timeout tunnel` keeps long-lived sockets open.

global
    maxconn 4096
    # Send access logs to the container's stdout (visible via `docker compose logs`).
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    option forwardfor
    option redispatch
    retries 3
    timeout connect 5s
    # Long-poll requests are held ~25s, so do not use a 30s client timeout.
    timeout client 120s
    timeout server 120s
    # WebSocket connections can stay open for the life of the tab.
    timeout tunnel 1h

frontend http_in
    bind *:80
    default_backend app_servers

backend app_servers
    # Round robin is the balancing strategy; the cookie below adds stickiness.
    balance roundrobin
    cookie SERVERID insert indirect nocache httponly

    # Only route to a replica that answers the public health route with 200.
    option httpchk GET /
    http-check expect status 200
    default-server inter 2s fall 3 rise 2

    server app1 app1:3000 check cookie app1
    server app2 app2:3000 check cookie app2

frontend stats
    bind *:8404
    mode http
    stats enable
    stats uri /
    stats refresh 5s
    stats show-legends
    # No authentication: this is intended for localhost only. Never expose the
    # stats port publicly, or protect it with `stats auth user:password`.
